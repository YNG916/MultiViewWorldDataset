extends: production_v1.yaml
profile: production

# Separate semantic version: a scene with fewer than two movable OnTop/Inside
# targets may use two real articulation/boolean-state changes as its initial
# DynamicConfiguration. Existing v1.1 shards must not be rewritten in place.
dataset:
  schema_version: "1.2.0"

configuration_sampling:
  nonrigid_fallback: true
  nonrigid_changed_objects: 2
  nonrigid_max_changed_objects: 4

generation:
  # Long CPU-active OmniGibson stages must not be mistaken for a dead worker.
  worker_progress_active_stage_timeout_s: 7200
