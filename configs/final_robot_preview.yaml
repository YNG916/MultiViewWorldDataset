extends: default.yaml
profile: smoke

dataset:
  scene_limit: 1
  accepted_configurations_per_scene: 1
  accepted_episodes_per_configuration: 1
  frames: 60

robot:
  use_final_robot: true

placement:
  minimum_pairwise_distance_m: 0.6

# A smoke run still exercises a genuine multi-object DynamicConfiguration, but
# fixes its size at the Dataset-v1.1 minimum so trajectory validation is not
# dominated by six expensive native relation-sampling calls.
configuration_sampling:
  movable_fraction: 0.01
  minimum_changed_objects: 2
  maximum_changed_objects: 2

trajectory:
  candidate_pool_size: 32
  sampling_maximum_attempts: 200

navigation:
  route_bank_target_size: 64
  # Smoke-only diagnostic threshold. Twelve independent routes already yield
  # 220 possible triplets; compatibility, PhysX, and GT-depth remain hard
  # gates. Production keeps the stricter default of 24.
  route_bank_minimum_size: 12
  route_bank_max_raw_attempts: 1500
  route_candidate_attempts_per_raw: 10
