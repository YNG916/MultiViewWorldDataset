extends: default.yaml
profile: smoke

dataset:
  scene_limit: 1
  accepted_configurations_per_scene: 1
  accepted_episodes_per_configuration: 1
  frames: 60

robot:
  use_final_robot: true

placement:
  minimum_pairwise_distance_m: 0.6

trajectory:
  # Eight nested sets divide this budget, yielding four paths per robot and 64
  # joint combinations per round while retaining bounded shortest-path work.
  candidate_pool_size: 32
  sampling_maximum_attempts: 200
