profile: default
seed: 20260826

machine:
  behavior_root_env: BEHAVIOR_ROOT
  output_root_env: DATASET_DEV_OUTPUT
  cache_root_env: DATASET_CACHE_ROOT

dataset:
  schema_version: "1.1.0"
  scene_limit: null
  accepted_configurations_per_scene: 150
  accepted_episodes_per_configuration: 3
  robots: 3
  frames: 60
  fps: 10
  scene_family_split_seed: 1907
  splits:
    train: 0.8
    val: 0.1
    test: 0.1

camera:
  rgb_width: 896
  rgb_height: 512
  geometry_width: 448
  geometry_height: 256
  hfov_deg: 70.0
  pitch_deg: -5.0
  roll_deg: 0.0
  near_m: 0.1
  far_m: 15.0
  heights_m: [0.8, 1.0, 1.2, 1.4]
  multimodal_alignment_keyframe_count: 7
  minimum_multimodal_alignment_fraction: 0.75
  maximum_capture_translation_error_m: 0.005
  maximum_capture_rotation_error_rad: 0.0087266463

bev:
  environment_meters_per_pixel: 0.02
  world_meters_per_pixel: 0.04
  bounds_margin_m: 0.5
  maximum_occupancy_fraction: 0.98
  robot_mask_projection_tolerance_m: 0.75
  modalities: [rgb, depth_linear, height, normal, semantic, instance, instance_id, occupancy, traversability]
  world_modalities: [rgb, depth_linear, height, semantic, instance, instance_id, occupancy]

placement:
  minimum_pairwise_distance_m: 0.6
  # Regime-aware start-only spacing; the hard per-frame minimum remains 0.6 m.
  # These are lower bounds only and never impose a maximum cluster radius.
  regime_trajectory_separation_headroom_m:
    dense_shared: 0.30
    partial_chain: 0.50
    exploratory: 0.90
  maximum_attempts: 200
  region_adjacency_distance_m: 0.5
  # Reject OG traversability pixels with no physical room-floor support. The
  # small tolerance only absorbs map/AABB discretization at doorway seams.
  floor_support_aabb_tolerance_m: 0.05
  # Use the same footprint expansion for starts and paths. Applying a larger
  # second start-only expansion can erase every feasible 3-robot placement in
  # furnished rooms even though the path map and exact contact QA are safe.
  dynamic_object_start_clearance_m: 0.45
  # AABBs already include each object's body; add the robot half-width plus
  # margin for paths. Execution still performs exact contact validation.
  dynamic_object_path_clearance_m: 0.45
  dynamic_object_path_obstacle_height_m: 0.65
  # Validate an exit over the same spatial scale as a valid trajectory. A
  # sub-metre ray can point into a pocket that has no usable 1--3 m route and
  # makes the expensive geodesic candidate pool fail repeatedly.
  initial_heading_probe_min_m: 1.0
  initial_heading_probe_max_m: 3.0
  # Resolution for searching a scene direction compatible with every robot's
  # individually traversable local exit.
  heading_consensus_search_step_deg: 5.0
  sibling_region_reuse_penalty: 1.0
  spatial_soft_probability_floor: 0.05
  regime_spatial_soft_scale_m:
    dense_shared: 1.75
    partial_chain: 2.25
    exploratory: null
  # Dense and partial-chain starts share a desired scene direction. Each guide
  # follows the closest robot-eroded local exit within the trajectory heading
  # tolerance, so obstacles may induce different paths without lateral sliding.
  lane_guide_distance_m: 2.0
  observation_regime_weights:
    dense_shared: 0.30
    partial_chain: 0.50
    exploratory: 0.20
  formation_degeneracy:
    minimum_mean_heading_difference_deg: 8.0
    maximum_mean_path_similarity: 0.96
    minimum_spatial_coverage_m2: 1.0

configuration_sampling:
  movable_fraction: 0.15
  minimum_changed_objects: 2
  maximum_changed_objects: 6
  stratify_by: [size, category, room, relation]

overlap:
  edge_threshold: 0.20
  useful_min: 0.20
  useful_max: 0.70
  near_duplicate_threshold: 0.90
  depth_sample_stride: 8
  reprojection_tolerance_m: 0.08

trajectory:
  path_length_min_m: 1.0
  path_length_max_m: 3.0
  maximum_linear_speed_mps: 0.8
  maximum_angular_speed_radps: 1.2
  maximum_acceleration_mps2: 1.5
  path_family_weights:
    direct: 0.30
    one_waypoint: 0.50
    two_waypoint: 0.20
  minimum_waypoint_trajectories: 1
  initial_heading_tolerance_deg: 35.0
  initial_heading_policy: trajectory_tangent
  # Dense and chain samples share a scene direction while retaining start-lane
  # offsets. A small nonzero floor preserves stochastic directional diversity.
  regime_initial_heading_probability_floor:
    dense_shared: 0.10
    partial_chain: 0.10
    exploratory: 1.00
  maximum_control_turn_deg: 55.0
  line_validation_spacing_m: 0.025
  smoothing_validation_spacing_m: 0.025
  # Fall back to the densely revalidated collision-safe shortcut polyline when
  # every positive Catmull-Rom strength cuts a narrow obstacle boundary.
  smoothing_strengths: [1.0, 0.5, 0.25, 0.0]
  candidate_pool_size: 6
  joint_pool_rounds: 5
  # Score a randomized subset once enough hard-valid 3-robot combinations
  # exist; exhaustively scoring candidate_pool_size^3 adds no hard QA value.
  maximum_joint_valid_candidates: 128
  trajectory_sets_per_placement: 8
  maximum_complementary_hybrid_candidates: 2
  # Recovery is triggered only after GT depth measured exactly one union edge.
  maximum_measured_overlap_bridge_candidates: 6
  measured_overlap_bridge_pool_size: 3
  measured_overlap_bridge_sampling_attempts: 120
  measured_overlap_bridge_target_depth_m: 3.0
  measured_overlap_bridge_guide_distance_m: 2.0
  measured_overlap_bridge_heading_floor: 0.02
  measured_overlap_bridge_guide_scale_m: 0.40
  measured_overlap_bridge_guide_floor: 0.02
  sampling_maximum_attempts: 200
  regime_coverage_saturation_m2:
    dense_shared: 8.0
    partial_chain: 16.0
    exploratory: 30.0
  # Softly preserve each robot's own regime view direction. This score never
  # compares robot headings, so it cannot reward parallel/compact formations.
  regime_initial_heading_prior_weights:
    dense_shared: 1.00
    partial_chain: 0.75
    exploratory: 0.00
  # Chain paths are softly biased toward their observation anchor. Dense guides
  # translate every start by the same vector, avoiding common-focus convergence;
  # hard separation and GT-depth connectivity checks remain authoritative.
  regime_trajectory_guide_soft_scale_m:
    dense_shared: 0.75
    partial_chain: 0.75
    exploratory: 1.50
  regime_trajectory_guide_probability_floor:
    dense_shared: 0.05
    partial_chain: 0.05
    exploratory: 1.00
  # Rank joint candidates by whether camera rays meet at shared scene targets.
  # This is soft only and does not reward compact positions or parallel headings.
  regime_view_connectivity_weights:
    dense_shared: 2.00
    partial_chain: 1.50
    exploratory: 0.75
  overlap_preflight:
    keyframe_count: 7
    geometry_width: 224
    geometry_height: 128
    # Soft topology targets used for regime QA / realized-regime labeling.
    # G_union connectivity remains the hard episode-level requirement.
    regime_connected_fraction_target:
      dense_shared: 0.60
      partial_chain: 0.30
      exploratory: 0.15
    regime_shared_keyframe_fraction_target:
      dense_shared: 0.60
      partial_chain: 0.30
      exploratory: 0.15
    regime_maximum_consecutive_isolated_keyframes:
      dense_shared: 2
      partial_chain: 4
      exploratory: 5
    depth_sample_stride: 4
  validation_position_tolerance_m: 1.0e-5
  validation_rotation_tolerance_rad: 1.0e-5

intervention:
  type_weights:
    rigid_relocation: 0.60
    articulation: 0.30
    state_change: 0.10
  translation_min_m: 0.3
  translation_max_m: 1.5
  rotation_min_deg: 30.0
  rotation_max_deg: 120.0
  maximum_attempts: 100
  application_mode: pre_rollout
  target_visibility:
    minimum_pixels: 64
    minimum_frames: 2
    minimum_robots: 1
    preferred_robots: 2
  post_render_effect:
    minimum_changed_pixels: 32
    minimum_mean_rgb_delta: 3.0
    maximum_resample_attempts: 8

sampling_diagnostics:
  sample_count: 100
  include_overlap_preflight: false
  collapse_warning_rate: 0.20
  output_name: sampling_diagnostics.json
  minimum_samples_for_distribution_warnings: 10
  collapse_thresholds:
    dominant_start_region_fraction_max: 0.90
    direct_path_fraction_max: 0.90
    parallel_episode_fraction_max: 0.80
    compact_start_episode_fraction_max: 0.90
    complete_triangle_keyframe_fraction_max: 0.90
    zero_visible_intervention_fraction_max: 0.00
    dominant_intervention_room_fraction_max: 0.90
    dominant_intervention_category_fraction_max: 0.90
    single_changed_object_configuration_fraction_max: 0.00
    temporal_union_connected_fraction_min: 0.10
  parallel_path_direction_similarity_min: 0.90
  compact_start_max_pairwise_distance_m: 3.0

generation:
  settle_steps: 30
  native_relation_high_level_attempts: 10
  native_relation_low_level_attempts: 10
  snapshot_restore_tolerance: 1.0e-5
  maximum_configuration_attempts: 1000
  exact_hash_decimals: 8
  near_duplicate_translation_m: 0.03
  near_duplicate_rotation_deg: 3.0
  atomic_finalize: true
  render_normals: true

robot:
  development_model: turtlebot
  final_model: mobile_sensor_robot_v1
  use_final_robot: true
