[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "multi-view-world-dataset"
version = "0.1.0"
description = "Portable generator for counterfactual synchronized multi-robot world observations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MultiViewWorldDataset contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6",
]

[project.optional-dependencies]
storage = ["pyarrow>=14", "zarr>=2.18"]
inspection = ["Pillow>=10", "Jinja2>=3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mvwd = "multi_view_world_dataset.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_view_world_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "simulator: requires the installed OmniGibson / Isaac Sim stack and a GPU",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

